<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Status Dashboard</title>
    <style>
      :root {
        --bg: #0f1419;
        --card: #1a2332;
        --text: #e7ecf3;
        --muted: #8b9bb4;
        --online: #3dd68c;
        --degraded: #f5a524;
        --offline: #f31260;
        --border: #2d3a4f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      header {
        padding: 1.5rem 1.25rem 0.5rem;
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 650;
        margin: 0 0 0.25rem;
      }
      .sub {
        color: var(--muted);
        font-size: 0.9rem;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 1rem 1.25rem 2rem;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      @media (max-width: 640px) {
        .summary {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .pill {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.75rem 1rem;
      }
      .pill span {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .pill strong {
        font-size: 1.35rem;
        font-weight: 700;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 0.75rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
      }
      .card h2 {
        margin: 0 0 0.35rem;
        font-size: 1rem;
        font-weight: 600;
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.65rem;
      }
      .badge {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 650;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        text-transform: capitalize;
      }
      .badge.online {
        background: rgba(61, 214, 140, 0.15);
        color: var(--online);
      }
      .badge.degraded {
        background: rgba(245, 165, 36, 0.15);
        color: var(--degraded);
      }
      .badge.offline {
        background: rgba(243, 18, 96, 0.15);
        color: var(--offline);
      }
      footer {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 1.25rem 1.5rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>API Status Dashboard</h1>
      <p class="sub">Mock data updates every few seconds — sample for Miro MCP + Cursor.</p>
    </header>
    <main>
      <section class="summary" id="summary"></section>
      <section class="grid" id="grid"></section>
    </main>
    <footer id="foot"></footer>
    <script>
      const summaryEl = document.getElementById("summary");
      const gridEl = document.getElementById("grid");
      const footEl = document.getElementById("foot");

      function pill(label, value) {
        const d = document.createElement("div");
        d.className = "pill";
        d.innerHTML = `<span>${label}</span><strong>${value}</strong>`;
        return d;
      }

      function render(data) {
        const { services, summary } = data;
        summaryEl.innerHTML = "";
        summaryEl.appendChild(pill("Total", summary.total));
        summaryEl.appendChild(pill("Online", summary.online));
        summaryEl.appendChild(pill("Degraded", summary.degraded));
        summaryEl.appendChild(pill("Offline", summary.offline));

        gridEl.innerHTML = "";
        for (const s of services) {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <h2>${escapeHtml(s.name)}</h2>
            <div class="meta">${escapeHtml(s.id)}</div>
            <span class="badge ${s.status}">${escapeHtml(s.status)}</span>
            <div class="meta" style="margin-top:0.5rem">Updated: ${escapeHtml(s.updatedAt)}</div>
          `;
          gridEl.appendChild(card);
        }
        footEl.textContent = "Last fetch: " + new Date().toLocaleTimeString();
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      async function poll() {
        try {
          const r = await fetch("/api/services");
          const data = await r.json();
          render(data);
        } catch (e) {
          footEl.textContent = "Could not reach API — is the server running?";
        }
      }

      poll();
      setInterval(poll, 2000);
    </script>
  </body>
</html>
